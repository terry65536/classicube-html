<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ClassiCube</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  #canvas_wrapper { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  #canvas {
    display: block; width: 100%; height: 100%;
    outline: none; touch-action: none; image-rendering: pixelated;
  }
  #loader {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: #0b0e13; color: #cfd6e4;
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    z-index: 10; transition: opacity .35s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #logo {
    font: 700 30px/1.1 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    letter-spacing: .18em; color: #f2f5fa; text-transform: uppercase;
  }
  #bar { width: 220px; height: 3px; background: #1e2733; border-radius: 2px; overflow: hidden; }
  #bar > i { display: block; width: 40%; height: 100%; background: #4a9eff; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(280%); } }
  #status { min-height: 22px; opacity: .75; font-size: 13px; }
  #copyright {
    margin-top: 26px; text-align: center;
    font-size: 11px; line-height: 1.8; color: #69758a;
  }
  #copyright b { font-weight: 600; color: #8493ab; }
</style>
</head>
<body>
<div id="canvas_wrapper"><canvas id="canvas" width="1280" height="720" tabindex="0"></canvas></div>
<div id="loader">
  <div id="logo">ClassiCube</div>
  <div id="bar"><i></i></div>
  <div id="status">正在加载…</div>
  <div id="copyright">

  </div>
</div>
<script>
function resizeGameCanvas() {
  var c = document.getElementById('canvas');
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(1, Math.round(window.innerWidth  * dpr));
  var h = Math.max(1, Math.round(window.innerHeight * dpr));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
}
resizeGameCanvas();
window.addEventListener('resize', resizeGameCanvas);
window.addEventListener('orientationchange', function () { setTimeout(resizeGameCanvas, 120); });

var loaderEl = document.getElementById('loader');
var statusEl = document.getElementById('status');
var bootTime = Date.now();

function hideLoader() {
  /* keep the splash (and its copyright line) up briefly so it can actually be read */
  var delay = Math.max(0, 2400 - (Date.now() - bootTime));
  setTimeout(function () { loaderEl.classList.add('hidden'); }, delay);
}

var Module = {
  arguments: ['Player'],
  canvas: document.getElementById('canvas'),
  print: function (text) { console.log(text); },
  printErr: function (text) { console.warn(text); },
  setStatus: function (text) {
    statusEl.textContent = text || '';
    if (!text) hideLoader();
  },
  onRuntimeInitialized: function () {
    resizeGameCanvas();
    statusEl.textContent = '';
    hideLoader();
    try { Module['canvas'].focus(); } catch (e) { }
  }
};

if (location.hash === '#diag') {
  window.__diagErrors = [];
  window.addEventListener('error', function (e) { window.__diagErrors.push(String(e.message)); });
  window.__diagTicks = 0;
  (function tick() { window.__diagTicks++; requestAnimationFrame(tick); })();
  setTimeout(function () {
    var c = document.getElementById('canvas');
    var info = {
      ticks: window.__diagTicks,
      cw: c.width, ch: c.height, cssW: c.clientWidth, cssH: c.clientHeight,
      hasFS: typeof window.CCFS !== 'undefined',
      fsEntries: (window.CCFS ? Object.keys(window.CCFS.entries).slice(0, 12) : null),
      idbErr: window.cc_idbErr || null,
      errors: window.__diagErrors,
      gl: (function () { try { var g = c.getContext('webgl2') || c.getContext('webgl'); return g ? g.getParameter(g.VERSION) : 'none'; } catch (e) { return 'err'; } })()
    };
    var pre = document.createElement('pre');
    pre.id = 'diag';
    pre.textContent = 'DIAG ' + JSON.stringify(info);
    document.body.appendChild(pre);
  }, 4000);
}

</script>
